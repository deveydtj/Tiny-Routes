name: TinyRoutes
options:
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  InternalTestFlight: release
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TinyRoutes:
    type: application
    platform: iOS
    sources:
      - path: TinyRoutes
        excludes:
          - Resources/Info.plist
          - Resources/PrototypeLevels
          - Resources/PrototypeSounds
      # Preserve this directory so prototype JSON never lands at the bundle root.
      - path: TinyRoutes/Resources/PrototypeLevels
        type: folder
        buildPhase: resources
      - path: TinyRoutes/Resources/PrototypeSounds
        type: folder
        buildPhase: resources
    resources:
      - TinyRoutes/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyroutes.app
        PRODUCT_NAME: TinyRoutes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TinyRoutes/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Match the existing committed Xcode project; do not create signing assets.
        CODE_SIGN_IDENTITY: iPhone Developer
        DEVELOPMENT_TEAM: JM23Z9GG95
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        SUPPORTS_MACCATALYST: NO
      configs:
        InternalTestFlight:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MULTIVAN_INTERNAL"
  TinyRoutesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TinyRoutesTests
        excludes:
          - Resources/PrototypeSolutions
      - path: TinyRoutesTests/Resources/PrototypeSolutions
        type: folder
        buildPhase: resources
    dependencies:
      - target: TinyRoutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyroutes.app.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_ASSET_PATHS: ""
schemes:
  TinyRoutes:
    build:
      targets:
        TinyRoutes: all
        TinyRoutesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TinyRoutesTests
    archive:
      config: Release
  MultiVanInternal:
    build:
      targets:
        TinyRoutes: all
        TinyRoutesTests: [test]
    run:
      config: InternalTestFlight
    test:
      config: Debug
      targets:
        - TinyRoutesTests
    profile:
      config: InternalTestFlight
    analyze:
      config: InternalTestFlight
    archive:
      config: InternalTestFlight
